<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 (Contact Us) | 오후의 키친</title>
  <meta name="description" content="오후의 키친 레시피 제휴, 문의 및 피드백 접수 창구입니다.">
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body>
  <div id="reading-progress"></div>
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-seal-svg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 11c0 4.418 3.582 8 8 8s8-3.582 8-8H4z" fill="currentColor" fill-opacity="0.2"/>
            <path d="M4 11h16" />
            <path d="M19 4L7 10" />
          </svg>
        </span>
        오후의 키친
        <span>Korean Everyday Food</span>
      </a>
      <button class="mobile-toggle" id="mobileToggle" aria-label="메뉴 열기">☰</button>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">홈</a></li>
          <li><a href="about.html">소개</a></li>
          <li><a href="contact.html" class="active">문의</a></li>
          <li><a href="privacy-policy.html">개인정보처리방침</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="main-layout full-width" style="max-width: 760px; margin: 2.5rem auto; padding: 0 1.5rem;">
    <main>
      <div style="background:#ffffff; padding:2.5rem; border-radius:8px; border:1px solid var(--border);">
        <h1 style="font-family: var(--font-serif); font-size:2rem; color:var(--ink-dark); margin-bottom:0.5rem;">✉️ 문의하기 (Contact Us)</h1>
        <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.95rem;">
          레시피에 관한 궁금한 점, 협업 제안, 피드백을 남겨주시면 정성껏 답변드리겠습니다.
        </p>

        <form id="contactForm" style="display:flex; flex-direction:column; gap:1.25rem;">
          <div>
            <label for="name" style="display:block; font-weight:700; font-size:0.9rem; margin-bottom:0.4rem;">이름 / 닉네임 *</label>
            <input type="text" id="name" required style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:4px; font-size:0.95rem;">
          </div>
          <div>
            <label for="email" style="display:block; font-weight:700; font-size:0.9rem; margin-bottom:0.4rem;">이메일 주소 *</label>
            <input type="email" id="email" required style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:4px; font-size:0.95rem;">
          </div>
          <div>
            <label for="message" style="display:block; font-weight:700; font-size:0.9rem; margin-bottom:0.4rem;">문의 내용 *</label>
            <textarea id="message" rows="5" required style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:4px; font-size:0.95rem; font-family:inherit;"></textarea>
          </div>
          <button type="submit" class="btn-editorial-primary" style="justify-content:center; padding:0.85rem; font-size:1rem; cursor:pointer;">
            문의 보내기 ✉
          </button>
        </form>

        <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border-light); font-size:0.88rem; color:var(--text-muted);">
          <p><strong>공식 이메일:</strong> gayagum12@naver.com</p>
          <p><strong>네이버 블로그:</strong> <a href="https://blog.naver.com/gayagum12" target="_blank" rel="noopener noreferrer" style="color:var(--deep-green); font-weight:bold; text-decoration:underline;">blog.naver.com/gayagum12</a></p>
        </div>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 오후의 키친. All rights reserved.</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
