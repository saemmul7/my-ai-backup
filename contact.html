<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 (Contact Us) | K-Food Insight</title>
  <meta name="description" content="K-Food Insight 에디토리얼 팀에 문의, 제휴 제안을 보내주세요.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="reading-progress"></div>
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">🥢 K-Food <span>Insight</span></a>
      <button class="mobile-toggle" id="mobileToggle">☰</button>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">홈</a></li>
          <li><a href="about.html">소개</a></li>
          <li><a href="contact.html" class="active">문의</a></li>
          <li><a href="privacy-policy.html">개인정보처리방침</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="main-layout full-width">
    <main class="page-container">
      <h1 class="page-title">✉️ 독자 문의 및 제휴 (Contact Us)</h1>
      
      <p style="margin-bottom: 2rem; color: var(--text-muted);">
        K-Food Insight 콘텐츠에 대한 피드백, 레시피 관련 질문, 비즈니스 협업 제안을 환영합니다. 아래 폼을 작성해 주시면 검토 후 답변드리겠습니다.
      </p>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">성함 또는 닉네임 *</label>
          <input type="text" id="name" class="form-input" placeholder="홍길동" required>
        </div>

        <div class="form-group">
          <label for="email">이메일 주소 *</label>
          <input type="email" id="email" class="form-input" placeholder="your-email@example.com" required>
        </div>

        <div class="form-group">
          <label for="subject">문의 주제 *</label>
          <input type="text" id="subject" class="form-input" placeholder="예: 레시피 제휴 문의, 오류 제보 등" required>
        </div>

        <div class="form-group">
          <label for="message">문의 내용 *</label>
          <textarea id="message" rows="6" class="form-textarea" placeholder="문의하실 상세 내용을 입력해 주세요." required></textarea>
        </div>

        <button type="submit" class="btn-primary">문의 메시지 보내기</button>
      </form>

      <div class="info-box" style="margin-top: 3rem;">
        <h4>직접 이메일 발송</h4>
        <p>웹 폼 이용이 원활하지 않을 경우 <code>contact@yourkfooddomain.com</code>으로 직접 메일을 보내주셔도 좋습니다.</p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>&copy; 2026 K-Food Insight. All rights reserved.</p>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
